<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Se connecter — Holisanna</title>
  <link rel="icon" href="assets/logo-holisanna-mark.png">
  <link rel="stylesheet" href="css/holisanna.css">
</head>
<body data-nav="espace" data-page="connexion">
<div id="site-header"></div>
<main class="auth-split">
  <div class="auth-side auth-side--olive">
    <img src="assets/illustration-cocktail-ivory.png" alt="" width="124" height="124">
    <h2>Content de vous<br>revoir sur votre<br><em>chemin</em>.</h2>
    <p class="auth-side__lead auth-side__lead--flush">Votre Cocktail bien-être vous attend. Continuez à explorer, à vous épanouir, à prendre soin de vous.</p>
  </div>
  <div class="auth-main">
    <div class="auth-box">
      <a class="auth-back" href="inscription.html">← Retour</a>
      <h1>Se connecter</h1>
      <p class="auth-sub">Bon retour parmi nous.</p>
      <div class="social-list">
          <button class="social-btn" type="button" data-social="Google"><svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path></svg>Continuer avec Google</button>
          <button class="social-btn" type="button" data-social="Apple"><svg viewBox="0 0 24 24" class="ico-apple"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"></path></svg>Continuer avec Apple</button>
        </div>
        <div class="divider"><span>ou par email</span></div>
      <form class="form" id="login-form">
        <div class="fld"><label for="email">Adresse email</label><input id="email" type="email" placeholder="votre@email.com" autocomplete="email" required></div>
        <div class="fld"><label for="pwd">Mot de passe</label><input id="pwd" type="password" placeholder="Votre mot de passe" autocomplete="current-password" required></div>
        <div class="forgot-row"><a href="mot-de-passe-oublie.html">Mot de passe oublié ?</a></div>
        <button class="btn btn-primary btn-lg" type="submit">Se connecter →</button>
        <p class="fine">Pas encore de compte ? <a class="text-link" href="inscription.html">Créer mon espace</a></p>
      </form>
    </div>
  </div>
</main>
<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/layout.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
